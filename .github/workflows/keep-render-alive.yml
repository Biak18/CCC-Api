name: Keep Render API Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render API
        run: curl -fsS --max-time 60 --retry 3 --retry-delay 10 https://ccc-api-ohwh.onrender.com/health
